services:
  db:
    image: postgres:17-alpine
    container_name: pokeca-dev-db
    environment:
      POSTGRES_USER: pokeca
      POSTGRES_PASSWORD: pokeca
      POSTGRES_DB: pokeca
    ports:
      - "5432:5432"
    volumes:
      - pokeca-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokeca -d pokeca"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pokeca-dev-db:
