name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pokeca-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'art-poke/pokeca' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          for key in AWS_DEPLOY_ROLE_ARN CLOUDFRONT_DISTRIBUTION_ID; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing production configuration: $key"
              exit 1
            fi
          done

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}
          aws-region: ap-northeast-1
          allowed-account-ids: "138681986450"

      - name: Deploy
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: bash scripts/deploy.sh

      - name: Check production
        run: |
          base=https://artpokeca.com
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --max-time 30 "$base/" --output /dev/null
          for slug in pikachu-with-grey-felt-hat melee-pokemon-scramble; do
            image="/specs/stories/og-$slug.jpg"
            curl --fail --silent --show-error --max-time 30 "$base$image" --output /dev/null
            curl --fail --silent --show-error --max-time 30 -A 'Twitterbot/1.0' "$base/stories/$slug" --output story.html
            grep -Fq "$image" story.html
          done
